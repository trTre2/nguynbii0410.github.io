// Generic filter/search block
function library(id, title, items, chipsFn, searchFn, cardFn, searchLabel, cls = "grid") {
  const chips = ["All", ...chipsFn.all];
  sec(id, title, `<div class="bar"><input type="search" id="${id}-q" placeholder="${searchLabel}" aria-label="${searchLabel}">${chips.map((c, i) => `<button class="chip" aria-pressed="${i === 0}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div><div class="${cls}" id="${id}-g"></div>`);
  let cur = "All";
  const draw = () => { const q = $(`#${id}-q`).value.toLowerCase();
    const r = items.filter(i => (cur === "All" || chipsFn.match(i, cur)) && (!q || searchFn(i).toLowerCase().includes(q)));
    $(`#${id}-g`).innerHTML = r.map(cardFn).join("") || `<div class="state">Không có kết quả.</div>`; };
  $(`#${id}-q`).oninput = draw;
  $(`#${id}`).querySelector(".bar").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; cur = b.dataset.c;
    $(`#${id}`).querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); };
  draw();
}

// Projects — tên lấy từ GitHub, nội dung do DATA.projectSettings viết
function projectFromRepo(r) {
  if (DATA.projectSettings.hiddenProjects.includes(r.name)) return null;
  const c = DATA.projectSettings.content[r.name] || {};
  return { name:r.name, description:c.description || "Project trên GitHub.", built:c.built || [], technologies:c.technologies || [], categories:c.categories || ["Personal"], github:r.html_url, demo:r.homepage || "", image:c.image || "", period:c.period || "", role:c.role || "", status:c.status || "" };
}
function renderProjects(repos) {
  const local = Object.keys(DATA.projectSettings.content).filter(n => !repos.some(r => r.name === n) && !DATA.projectSettings.hiddenProjects.includes(n)).map(n => projectFromRepo({ name: n, html_url: "", homepage: "" }));
  const projects = [...local, ...repos.map(projectFromRepo).filter(Boolean)];
  const shown = DATA.projectSettings.featuredProjects.length ? projects.filter(p => DATA.projectSettings.featuredProjects.includes(p.name)) : projects;
  library("projects", "Dự án", shown,
    { all:["Web","Desktop","Mobile","AI","IoT","Academic","Personal"], match:(p,c)=>(p.categories||[]).includes(c) },
    p => [p.name,(p.technologies||[]).join(" "),(p.categories||[]).join(" ")].join(" "),
    p => `<article class="pj"><div class="pjimg">${p.image ? img(p.image,p.name,"") : esc(p.name.slice(0,2).toUpperCase())}</div><div class="pjb">${p.status ? `<span class="tag">${esc(p.status)}</span>` : ""}<h3>${esc(p.name)}</h3><p>${esc(p.description)}</p>${p.built.length ? `<p class="mut"><b>Trong project này:</b></p><ul class="mut">${p.built.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`:""}<div>${tags(p.technologies)}</div><p class="mut">${[p.period,p.role].filter(Boolean).map(esc).join(" · ")}</p><div class="row">${link(p.github,"GitHub")}${link(p.demo,"Demo")}</div></div></article>`,
    "Tìm theo tên, công nghệ, danh mục…","showcase");
}

const repoCard = r => `<article class="card"><h3>${esc(r.name)}</h3><p class="mut">${esc(r.description || "")}</p>
<p class="mut">${[r.language, r.stars != null ? "★ " + r.stars : "", r.forks != null ? "⑂ " + r.forks : "", r.updated ? "Cập nhật " + new Date(r.updated).toLocaleDateString("vi-VN") : ""].filter(Boolean).map(esc).join(" · ")}</p>
<div>${tags(r.topics)}</div><div class="row">${link(r.url, "Repository")}${link(r.homepage, "Live Demo")}</div></article>`;
async function loadGithub() {
  const u = DATA.github.username, box = () => $("#gh-body");
  sec("github", "GitHub", `<div id="gh-body"><div class="state" role="status">Đang tải GitHub…</div></div>`);
  const fb = DATA.fallbackRepos.map(repoCard).join("");
  const fail = msg => { box().innerHTML = `<div class="state" role="alert">${msg}</div><div class="grid">${fb}</div>`; };
  if (!u || /^YOUR_/.test(u)) return fail("Chưa nhập GitHub username (DATA.github.username).");
  const key = "gh:" + u, c = store.get(key); let d;
  try { const o = c && JSON.parse(c); if (o && Date.now() - o.t < DATA.github.cacheMinutes * 6e4) d = o.d; } catch {}
  try {
    if (!d) {
      const [a, b] = await Promise.all([fetch(`https://api.github.com/users/${encodeURIComponent(u)}`), fetch(`https://api.github.com/users/${encodeURIComponent(u)}/repos?sort=updated&per_page=30`)]);
      if (!a.ok || !b.ok) throw new Error(a.status === 403 || b.status === 403 ? "rate" : "http");
      d = { user: await a.json(), repos: await b.json() }; store.set(key, JSON.stringify({ t: Date.now(), d }));
    }
    const excludedRepos = new Set(["tt", "test", "vpp"]);
    const repos = d.repos
      .filter(r => !r.fork && !excludedRepos.has(r.name))
      .sort((x, y) => y.stargazers_count - x.stargazers_count || new Date(y.pushed_at) - new Date(x.pushed_at)); renderProjects(repos);
    const langs = [...new Set(d.repos.map(r => r.language).filter(Boolean))];
    box().innerHTML = `<div class="card" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px">${img(d.user.avatar_url, "Avatar GitHub " + d.user.login, "av")}<div style="min-width:0"><h3>${esc(d.user.login)}</h3><p class="mut">${esc(d.user.bio || "")}</p><p class="mut">${d.user.public_repos} public repos · ${esc(langs.join(", "))}</p>${link(d.user.html_url, "Mở GitHub")}</div></div>
    <div class="grid">${repos.map(r => repoCard({ name: r.name, description: r.description, language: r.language, stars: r.stargazers_count, forks: r.forks_count, updated: r.pushed_at, topics: r.topics, url: r.html_url, homepage: r.homepage })).join("")}</div>`;
  } catch (e) { fail("Unable to load GitHub data" + (e.message === "rate" ? " (có thể do giới hạn API, thử lại sau)." : ".")); }
}
loadGithub();

const musicEmbed = m => {
  if (m.type === "youtube" && m.id) return `<iframe class="music-frame" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(m.id)}?autoplay=1&rel=0" title="${esc(m.title)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  if (m.type === "spotify" && m.id) return `<iframe class="music-frame music-spotify" src="https://open.spotify.com/embed/track/${encodeURIComponent(m.id)}?utm_source=generator" title="${esc(m.title)}" allow="autoplay; encrypted-media" ></iframe>`;
  return "";
};
const trackBtn = (m, i) => (m.type === "youtube" || m.type === "spotify") && m.id ? `<button class="btn p play" data-i="${i}" aria-label="Phát ${esc(m.title)}">▶ Phát</button>` : link(m.url, "Mở bài");
sec("interests", "Sở thích", `<div class="mosaic">${DATA.interests.map(i => `<article class="card"><div class="big" aria-hidden="true">${esc(i.icon || "✦")}</div><h3 style="margin-top:8px">${ph(i.name)}</h3><p>${ph(i.description)}</p>${i.why ? `<p class="mut"><b>Vì sao:</b> ${esc(i.why)}</p>` : ""}${i.since ? `<p class="mut">Từ: ${esc(i.since)}</p>` : ""}<div>${tags(i.favorites)}</div><div class="row">${links(i.relatedLinks)}</div></article>`).join("")}</div>`);

// Music — chạm bài nào thì chỉ nhúng/phát bài đó
sec("music", "Nhạc", `<p class="mut">Chạm vào bài nào thì phát bài đó.</p><div class="music-grid">${DATA.music.map((m, i) => `<article class="card music-card" data-i="${i}"><h3>${esc(m.title)}</h3><p class="mut">${esc(m.artist)}${m.note ? " · " + esc(m.note) : ""}</p><div class="slot">${trackBtn(m, i)}</div></article>`).join("")}</div>`);
$("#music .music-grid").onclick = e => {
  const b = e.target.closest(".play"); if (!b) return;
  const slot = b.closest(".slot"), m = DATA.music[b.dataset.i];
  document.querySelectorAll("#music .music-card").forEach(c => { c.querySelector(".slot").innerHTML = trackBtn(DATA.music[c.dataset.i], c.dataset.i); });
  slot.innerHTML = musicEmbed(m);
};

// Education (accordion), timeline
sec("education", "Học tập", DATA.education.map(e => `<details class="card" style="margin-bottom:12px"><summary>${ph(e.school)} — ${ph(e.major)}${e.period ? " (" + esc(e.period) + ")" : ""}</summary>
${e.subjects?.length ? `<p class="mut">Môn liên quan:</p><div>${tags(e.subjects)}</div>` : ""}${e.projects?.length ? `<p class="mut">Projects:</p><div>${tags(e.projects)}</div>` : ""}</details>`).join(""));
const CAT = { Education: "#f59e0b", Project: "#6ea8ff", Internship: "#a78bfa", Activity: "#34d399", Milestone: "#22d3ee" };
sec("timeline", "Hành trình", `<p class="mut">Một vài mốc mình muốn giữ lại.</p><div class="tl">${DATA.timeline.map(t => `<div class="card" style="--c:${CAT[t.category] || "var(--ac)"}"><span class="tag" style="color:var(--c);border-color:var(--c)">${esc(t.category)}</span> <span class="mut">${ph(t.date)}</span><h3>${ph(t.title)}</h3><p class="mut">${ph(t.description)}</p>${t.reflection ? `<p class="refl">“${esc(t.reflection)}”</p>` : ""}</div>`).join("")}</div>`);

// Contact
const shown = DATA.socialLinks.filter(l => l.url);
sec("contact", "Tìm mình ở đây", shown.length ? `<div class="row">${shown.map(l => link(l.url, l.label)).join("")}</div>` : `<div class="state">Chưa có link nào (DATA.socialLinks).</div>`);
$("#foot").textContent = `© ${new Date().getFullYear()} ${P.name}`;
</script>
</body>
</html>
