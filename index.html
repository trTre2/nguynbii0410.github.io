// Generic filter/search block
function library(id, title, items, chipsFn, searchFn, cardFn, searchLabel, cls = "grid") {
  const chips = ["All", ...chipsFn.all];
  sec(id, title, `<div class="bar"><input type="search" id="${id}-q" placeholder="${searchLabel}" aria-label="${searchLabel}">${chips.map((c, i) => `<button class="chip" aria-pressed="${i === 0}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div><div class="${cls}" id="${id}-g"></div>`);
  let cur = "All";
  const draw = () => { const q = $(`#${id}-q`).value.toLowerCase();
    const r = items.filter(i => (cur === "All" || chipsFn.match(i, cur)) && (!q || searchFn(i).toLowerCase().includes(q)));
    $(`#${id}-g`).innerHTML = r.map(cardFn).join("") || `<div class="state">Không có kết quả.</div>`; };
  $(`#${id}-q`).oninput = draw;
  $(`#${id}`).querySelector(".bar").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; cur = b.dataset.c;
    $(`#${id}`).querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); };
  draw();
}

function projectFromRepo(r) {

  return { name:r.name, description:c.description || "Project trên GitHub.", built:c.built || [], technologies:c.technologies || [], categories:c.categories || ["Personal"], github:r.html_url, demo:r.homepage || "", image:c.image || "", period:c.period || "", role:c.role || "", status:c.status || "" };
}

const repoCard = r => `<article class="card"><h3>${esc(r.name)}</h3><p class="mut">${esc(r.description || "")}</p>

<div>${tags(r.topics)}</div><div class="row">${link(r.url, "Repository")}${link(r.homepage, "Live Demo")}</div></article>`;
async function loadGithub() {
  const u = DATA.github.username, box = () => $("#gh-body");
  sec("github", "GitHub", `<div id="gh-body"><div class="state" role="status">Đang tải GitHub…</div></div>`);
  const fb = DATA.fallbackRepos.map(repoCard).join("");
  const fail = msg => { box().innerHTML = `<div class="state" role="alert">${msg}</div><div class="grid">${fb}</div>`; };
  if (!u || /^YOUR_/.test(u)) return fail("Chưa nhập GitHub username (DATA.github.username).");
  const key = "gh:" + u, c = store.get(key); let d;
  try { const o = c && JSON.parse(c); if (o && Date.now() - o.t < DATA.github.cacheMinutes * 6e4) d = o.d; } catch {}
  try {
    if (!d) {
      const [a, b] = await Promise.all([fetch(`https://api.github.com/users/${encodeURIComponent(u)}`), fetch(`https://api.github.com/users/${encodeURIComponent(u)}/repos?sort=updated&per_page=30`)]);
      if (!a.ok || !b.ok) throw new Error(a.status === 403 || b.status === 403 ? "rate" : "http");
      d = { user: await a.json(), repos: await b.json() }; store.set(key, JSON.stringify({ t: Date.now(), d }));
    }
    const excludedRepos = new Set(["tt", "test", "vpp"]);
    const repos = d.repos
      .filter(r => !r.fork && !excludedRepos.has(r.name))
      .sort((x, y) => y.stargazers_count - x.stargazers_count || new Date(y.pushed_at) - new Date(x.pushed_at)); renderProjects(repos);
    const langs = [...new Set(d.repos.map(r => r.language).filter(Boolean))];
    box().innerHTML = `<div class="card" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px">${img(d.user.avatar_url, "Avatar GitHub " + d.user.login, "av")}<div style="min-width:0"><h3>${esc(d.user.login)}</h3><p class="mut">${esc(d.user.bio || "")}</p><p class="mut">${d.user.public_repos} public repos · ${esc(langs.join(", "))}</p>${link(d.user.html_url, "Mở GitHub")}</div></div>
    <div class="grid">${repos.map(r => repoCard({ name: r.name, description: r.description, language: r.language, stars: r.stargazers_count, forks: r.forks_count, updated: r.pushed_at, topics: r.topics, url: r.html_url, homepage: r.homepage })).join("")}</div>`;
  } catch (e) { fail("Unable to load GitHub data" + (e.message === "rate" ? " (có thể do giới hạn API, thử lại sau)." : ".")); }
}
loadGithub();

async function loadCovers() {
  await Promise.all(DATA.games.filter(g => !g.cover && !coverCache[g.wiki || g.name]).map(async g => {
    const k = g.wiki || g.name; let u = "";
    try { const res = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(k)); if (res.ok) u = (await res.json()).thumbnail?.source || ""; } catch {}
    coverCache[k] = u;
    if (u) document.querySelectorAll("#games .cov").forEach(c => {
      if (c.dataset.k === k && !c.querySelector("img")) c.insertAdjacentHTML("afterbegin", img(u, "Ảnh " + g.name, "game-logo"));
    });
  }));
  store.set("covers", JSON.stringify(Object.fromEntries(Object.entries(coverCache).filter(([,v]) => v))));
}
